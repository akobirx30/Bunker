<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚠️ BUNKER</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Russo+One&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Share Tech Mono', monospace;
            background: #0A0A0A;
            color: #FFD000;
            min-height: 100vh;
            padding: 10px;
        }
        .container { max-width: 600px; margin: 0 auto; }
        .header {
            background: #FFD000;
            color: #0A0A0A;
            padding: 15px;
            text-align: center;
            border: 4px solid #000;
            margin-bottom: 20px;
            font-family: 'Russo One', sans-serif;
            font-size: 24px;
        }
        .panel {
            background: #1A1A1A;
            border: 3px solid #FFD000;
            padding: 20px;
            margin-bottom: 20px;
        }
        h2 {
            font-family: 'Russo One', sans-serif;
            font-size: 18px;
            margin-bottom: 15px;
            color: #FFD000;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #2A2A2A;
            border: 2px solid #CC9900;
            color: #FFD000;
            font-family: 'Share Tech Mono', monospace;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            background: #FFD000;
            color: #0A0A0A;
            border: 3px solid #000;
            font-family: 'Russo One', sans-serif;
            font-size: 16px;
            cursor: pointer;
            text-transform: uppercase;
        }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        button.secondary { background: #2A2A2A; color: #FFD000; border-color: #FFD000; }
        .card {
            background: #2A2A2A;
            border: 3px solid #FF3333;
            padding: 15px;
            margin: 10px 0;
            cursor: pointer;
            min-height: 70px;
        }
        .card.revealed {
            border-color: #00FF00;
            background: rgba(0, 255, 0, 0.1);
            cursor: default;
        }
        .card:hover:not(.revealed) {
            border-color: #FFD000;
            transform: translateX(5px);
        }
        .card-title {
            font-size: 14px;
            color: #FFD000;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .card-value {
            font-size: 16px;
            color: white;
        }
        .player {
            background: #1A1A1A;
            border-left: 4px solid #FFD000;
            padding: 15px;
            margin: 10px 0;
        }
        .player.me {
            border-left-color: #00FF00;
            background: rgba(0, 255, 0, 0.05);
        }
        .player-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .revealed-card {
            background: rgba(0, 255, 0, 0.1);
            border: 2px solid #00FF00;
            padding: 8px;
            margin: 5px 0;
            font-size: 13px;
        }
        .vote-btn {
            background: #FF3333;
            color: white;
            padding: 10px;
            margin: 5px 0;
            border: 2px solid white;
            cursor: pointer;
        }
        .vote-btn.selected {
            background: white;
            color: #FF3333;
        }
        .hidden { display: none !important; }
        .alert {
            padding: 12px;
            margin: 12px 0;
            border: 3px solid #FFD000;
            background: #1A1A1A;
            color: #FFD000;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">⚠️ BUNKER ⚠️</div>
        
        <div id="languageScreen">
            <div class="panel">
                <h2 style="text-align: center; margin-bottom: 30px;">SELECT LANGUAGE</h2>
                <button onclick="game.setLanguage('en')">🇬🇧 ENGLISH</button>
                <button onclick="game.setLanguage('ru')">🇷🇺 РУССКИЙ</button>
            </div>
        </div>
        
        <div id="welcomeScreen" class="hidden">
            <div class="panel">
                <h2>JOIN GAME</h2>
                <input type="text" id="nickname" placeholder="Your name" maxlength="20">
                <button onclick="game.createRoom()">CREATE ROOM</button>
                <div style="text-align: center; margin: 15px 0;">- OR -</div>
                <input type="text" id="roomCode" placeholder="Room code" maxlength="6" style="text-transform: uppercase;">
                <button onclick="game.joinRoom()">JOIN ROOM</button>
            </div>
        </div>
        
        <div id="lobbyScreen" class="hidden">
            <div class="panel">
                <h2>ROOM: <span id="lobbyCode"></span></h2>
                <div class="alert">Share this code!</div>
                <div id="lobbyPlayers"></div>
                <button id="startBtn" onclick="game.startGame()" disabled>START GAME</button>
                <button class="secondary" onclick="game.leave()">LEAVE</button>
            </div>
        </div>
        
        <div id="gameScreen" class="hidden">
            <div class="panel">
                <h2>ROUND <span id="round">1</span> / 5</h2>
                <div id="gameInfo"></div>
            </div>
            
            <div class="panel">
                <h2>📋 YOUR CARDS</h2>
                <div id="myCards">LOADING...</div>
            </div>
            
            <div class="panel">
                <h2>👥 OTHER PLAYERS</h2>
                <div id="otherPlayers">LOADING...</div>
            </div>
            
            <button id="nextBtn" class="hidden" onclick="game.nextPhase()">NEXT →</button>
        </div>
        
        <div id="voteScreen" class="hidden">
            <div class="panel">
                <h2>⚠️ VOTING ⚠️</h2>
                <div class="alert">Choose who to eliminate!</div>
                <div id="voteOptions"></div>
                <button id="voteBtn" onclick="game.vote()" disabled>VOTE</button>
            </div>
        </div>
        
        <div id="resultScreen" class="hidden">
            <div class="panel">
                <h2>RESULTS</h2>
                <div id="resultText"></div>
                <button onclick="game.continueGame()">CONTINUE</button>
            </div>
        </div>
        
        <div id="finaleScreen" class="hidden">
            <div class="panel">
                <h2>🏆 GAME OVER</h2>
                <h2>SURVIVORS:</h2>
                <div id="winners"></div>
                <button onclick="game.reset()">NEW GAME</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getDatabase, ref, set, get, onValue, update } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

        const firebaseConfig = {
            apiKey: "AIzaSyCB-CzOu81ffXyHW8r9VAfnG7NH8K_fTkY",
            authDomain: "bunker-game-ako.firebaseapp.com",
            databaseURL: "https://bunker-game-ako-default-rtdb.firebaseio.com",
            projectId: "bunker-game-ako",
            storageBucket: "bunker-game-ako.firebasestorage.app",
            messagingSenderId: "985630537179",
            appId: "1:985630537179:web:73ca0d91fe48d9657da3fe"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        window.db = db;
        window.dbRef = ref;
        window.dbSet = set;
        window.dbGet = get;
        window.dbOnValue = onValue;
        window.dbUpdate = update;
        
        console.log('✅ Firebase connected!');
    </script>

    <script>
        const CARDS_EN = {
            profession: ["Doctor", "Engineer", "Soldier", "Teacher", "Farmer"],
            age: ["18", "25", "30", "35", "40"],
            gender: ["Male", "Female"],
            health: ["Excellent", "Good", "Asthma"],
            skills: ["Hunter", "Gardener", "Medicine"],
            trait: ["Leader", "Loyal", "Calm"],
            baggage: ["First Aid", "Tools", "Laptop"],
            unique: ["Night Vision", "Claustrophobia", "Criminal"]
        };

        const CARDS_RU = {
            profession: ["Врач", "Инженер", "Солдат", "Учитель", "Фермер"],
            age: ["18", "25", "30", "35", "40"],
            gender: ["Мужчина", "Женщина"],
            health: ["Отличное", "Хорошее", "Астма"],
            skills: ["Охотник", "Садовод", "Медицина"],
            trait: ["Лидер", "Верный", "Спокойный"],
            baggage: ["Аптечка", "Инструменты", "Ноутбук"],
            unique: ["Ночное зрение", "Клаустрофобия", "Преступник"]
        };

        const game = {
            lang: 'en',
            roomCode: null,
            playerId: null,
            playerName: null,
            myCards: null,
            selectedVote: null,
            listener: null,

            setLanguage(lang) {
                console.log('Language set:', lang);
                this.lang = lang;
                document.getElementById('languageScreen').classList.add('hidden');
                document.getElementById('welcomeScreen').classList.remove('hidden');
            },

            async createRoom() {
                const name = document.getElementById('nickname').value.trim();
                if (!name) { alert('Enter name!'); return; }

                this.roomCode = Math.random().toString(36).substring(2, 8).toUpperCase();
                this.playerId = Date.now().toString();
                this.playerName = name;
                this.myCards = this.assignCards();
                
                console.log('Creating room with cards:', this.myCards);

                const roomData = {
                    code: this.roomCode,
                    host: this.playerId,
                    players: {},
                    status: 'lobby',
                    round: 1,
                    votes: {}
                };

                roomData.players[this.playerId] = {
                    id: this.playerId,
                    name: name,
                    cards: this.myCards,
                    revealed: [],
                    alive: true
                };

                try {
                    await window.dbSet(window.dbRef(window.db, `rooms/${this.roomCode}`), roomData);
                    console.log('✅ Room created in Firebase!');
                    this.showLobby();
                    this.listen();
                } catch (e) {
                    console.error('❌ Error:', e);
                    alert('Error: ' + e.message);
                }
            },

            async joinRoom() {
                const name = document.getElementById('nickname').value.trim();
                const code = document.getElementById('roomCode').value.trim().toUpperCase();
                if (!name || !code) { alert('Enter name and code!'); return; }

                try {
                    const snapshot = await window.dbGet(window.dbRef(window.db, `rooms/${code}`));
                    if (!snapshot.exists()) { alert('Room not found!'); return; }

                    const room = snapshot.val();
                    if (room.status !== 'lobby') { alert('Game started!'); return; }

                    this.roomCode = code;
                    this.playerId = Date.now().toString();
                    this.playerName = name;
                    this.myCards = this.assignCards();
                    
                    console.log('Joining with cards:', this.myCards);

                    await window.dbUpdate(window.dbRef(window.db, `rooms/${code}/players/${this.playerId}`), {
                        id: this.playerId,
                        name: name,
                        cards: this.myCards,
                        revealed: [],
                        alive: true
                    });

                    console.log('✅ Joined room!');
                    this.showLobby();
                    this.listen();
                } catch (e) {
                    console.error('❌ Error:', e);
                    alert('Error: ' + e.message);
                }
            },

            assignCards() {
                const shuffle = arr => [...arr].sort(() => Math.random() - 0.5);
                const cards = this.lang === 'en' ? CARDS_EN : CARDS_RU;
                
                const assigned = {
                    profession: shuffle(cards.profession)[0],
                    age: shuffle(cards.age)[0],
                    gender: shuffle(cards.gender)[0],
                    health: shuffle(cards.health)[0],
                    skills: shuffle(cards.skills)[0],
                    trait: shuffle(cards.trait)[0],
                    baggage: shuffle(cards.baggage)[0],
                    unique: shuffle(cards.unique)[0]
                };
                
                console.log('Assigned cards:', assigned);
                return assigned;
            },

            showLobby() {
                document.getElementById('welcomeScreen').classList.add('hidden');
                document.getElementById('lobbyScreen').classList.remove('hidden');
                document.getElementById('lobbyCode').textContent = this.roomCode;
            },

            listen() {
                if (this.listener) this.listener();
                
                const roomRef = window.dbRef(window.db, `rooms/${this.roomCode}`);
                this.listener = window.dbOnValue(roomRef, (snapshot) => {
                    if (!snapshot.exists()) {
                        alert('Room deleted!');
                        this.reset();
                        return;
                    }

                    const room = snapshot.val();
                    console.log('Room update:', room);
                    
                    if (room.status === 'lobby') this.updateLobby(room);
                    else if (room.status === 'playing') this.updateGame(room);
                    else if (room.status === 'voting') this.showVoting(room);
                    else if (room.status === 'results') this.showResults(room);
                    else if (room.status === 'finale') this.showFinale(room);
                });
            },

            updateLobby(room) {
                const players = Object.values(room.players);
                const html = players.map(p => `
                    <div class="player ${p.id === this.playerId ? 'me' : ''}">
                        ${p.id === room.host ? '👑 ' : ''}${p.name}
                        ${p.id === this.playerId ? ' (YOU)' : ''}
                    </div>
                `).join('');
                
                document.getElementById('lobbyPlayers').innerHTML = html;
                document.getElementById('startBtn').disabled = players.length < 4 || room.host !== this.playerId;

                if (room.status !== 'lobby') {
                    document.getElementById('lobbyScreen').classList.add('hidden');
                    document.getElementById('gameScreen').classList.remove('hidden');
                }
            },

            async startGame() {
                try {
                    const snapshot = await window.dbGet(window.dbRef(window.db, `rooms/${this.roomCode}`));
                    const room = snapshot.val();

                    if (room.host !== this.playerId) { alert('Only host!'); return; }
                    if (Object.keys(room.players).length < 4) { alert('Need 4+ players!'); return; }

                    await window.dbUpdate(window.dbRef(window.db, `rooms/${this.roomCode}`), { status: 'playing' });
                    console.log('✅ Game started!');
                } catch (e) { console.error(e); }
            },

            updateGame(room) {
                console.log('Updating game screen...');
                document.getElementById('lobbyScreen').classList.add('hidden');
                document.getElementById('voteScreen').classList.add('hidden');
                document.getElementById('gameScreen').classList.remove('hidden');

                document.getElementById('round').textContent = room.round;
                
                const alive = Object.values(room.players).filter(p => p.alive).length;
                document.getElementById('gameInfo').innerHTML = `
                    <div class="alert">Alive: ${alive}</div>
                    <div class="alert">${room.round === 1 ? 'Open PROFESSION' : 'Open ONE card'}</div>
                `;

                // GET MY DATA FROM FIREBASE
                const myData = room.players[this.playerId];
                if (!myData) {
                    console.error('❌ My player data not found!');
                    document.getElementById('myCards').innerHTML = '<div class="alert" style="border-color: red;">ERROR: Your data not found in Firebase!</div>';
                    return;
                }

                // USE CARDS FROM FIREBASE
                const myCards = myData.cards;
                console.log('My cards from Firebase:', myCards);
                
                if (!myCards || Object.keys(myCards).length === 0) {
                    console.error('❌ No cards found!');
                    document.getElementById('myCards').innerHTML = '<div class="alert" style="border-color: red;">ERROR: No cards!</div>';
                    return;
                }

                // UPDATE LOCAL CACHE
                this.myCards = myCards;

                // RENDER CARDS
                const cardNames = {
                    profession: '💼 PROFESSION',
                    age: '📅 AGE',
                    gender: '👤 GENDER',
                    health: '❤️ HEALTH',
                    skills: '⚡ SKILL',
                    trait: '🎭 TRAIT',
                    baggage: '🎒 BAGGAGE',
                    unique: '⭐ UNIQUE'
                };

                const myCardsHtml = Object.keys(myCards).map(type => {
                    const revealed = myData.revealed.includes(type);
                    const shouldReveal = room.round === 1 && type === 'profession';
                    
                    return `
                        <div class="card ${revealed ? 'revealed' : ''}" 
                             onclick="${revealed ? '' : `game.revealCard('${type}')`}">
                            <div class="card-title">
                                ${cardNames[type]}
                                ${revealed ? ' ✅' : shouldReveal ? ' ⚠️ CLICK!' : ' 🔒'}
                            </div>
                            ${revealed ? 
                                `<div class="card-value">${myCards[type]}</div>` : 
                                `<div class="card-value" style="color: #CC9900;">
                                    ${shouldReveal ? 'TAP TO REVEAL!' : 'Tap to reveal'}
                                </div>`}
                        </div>
                    `;
                }).join('');

                document.getElementById('myCards').innerHTML = myCardsHtml;
                console.log('✅ Cards rendered!');

                // OTHER PLAYERS
                const others = Object.values(room.players).filter(p => p.id !== this.playerId);
                const othersHtml = others.map(p => {
                    const revealedCards = p.revealed || [];
                    return `
                        <div class="player">
                            <div class="player-name">${p.name} ${p.alive ? '✓' : '☠️'}</div>
                            ${revealedCards.length > 0 ? `
                                <div style="font-size: 12px; margin: 5px 0;">Revealed:</div>
                                ${revealedCards.map(type => `
                                    <div class="revealed-card">
                                        ${cardNames[type]}: ${p.cards[type]}
                                    </div>
                                `).join('')}
                            ` : `<div style="font-size: 12px; color: #CC9900;">No cards revealed</div>`}
                        </div>
                    `;
                }).join('');

                document.getElementById('otherPlayers').innerHTML = othersHtml;

                const nextBtn = document.getElementById('nextBtn');
                if (room.host === this.playerId) {
                    nextBtn.classList.remove('hidden');
                } else {
                    nextBtn.classList.add('hidden');
                }
            },

            async revealCard(type) {
                console.log('Revealing card:', type);
                try {
                    const path = `rooms/${this.roomCode}/players/${this.playerId}/revealed`;
                    const snapshot = await window.dbGet(window.dbRef(window.db, path));
                    const revealed = snapshot.val() || [];
                    
                    if (!revealed.includes(type)) {
                        revealed.push(type);
                        await window.dbSet(window.dbRef(window.db, path), revealed);
                        console.log('✅ Card revealed!');
                    }
                } catch (e) { console.error('❌ Error revealing:', e); }
            },

            async nextPhase() {
                try {
                    const snapshot = await window.dbGet(window.dbRef(window.db, `rooms/${this.roomCode}`));
                    const room = snapshot.val();

                    if (room.host !== this.playerId) { alert('Only host!'); return; }

                    if (room.round === 1) {
                        await window.dbUpdate(window.dbRef(window.db, `rooms/${this.roomCode}`), { round: 2 });
                    } else {
                        await window.dbUpdate(window.dbRef(window.db, `rooms/${this.roomCode}`), { status: 'voting', votes: {} });
                    }
                } catch (e) { console.error(e); }
            },

            showVoting(room) {
                document.getElementById('gameScreen').classList.add('hidden');
                document.getElementById('voteScreen').classList.remove('hidden');

                const alive = Object.values(room.players).filter(p => p.alive);
                const html = alive.map(p => `
                    <div class="vote-btn ${this.selectedVote === p.id ? 'selected' : ''}" 
                         onclick="game.selectVote('${p.id}')">
                        ${p.name}
                    </div>
                `).join('');

                document.getElementById('voteOptions').innerHTML = html;
                
                const hasVoted = room.votes && room.votes[this.playerId];
                document.getElementById('voteBtn').disabled = !this.selectedVote || hasVoted;
                document.getElementById('voteBtn').textContent = hasVoted ? 'VOTED' : 'VOTE';
            },

            selectVote(id) {
                this.selectedVote = id;
                const snapshot = { players: {}, votes: {} };
                this.showVoting(snapshot);
            },

            async vote() {
                if (!this.selectedVote) return;

                try {
                    await window.dbUpdate(window.dbRef(window.db, `rooms/${this.roomCode}/votes/${this.playerId}`), this.selectedVote);

                    const snapshot = await window.dbGet(window.dbRef(window.db, `rooms/${this.roomCode}`));
                    const room = snapshot.val();

                    if (room.host === this.playerId) {
                        const players = Object.values(room.players);
                        const voteCount = Object.keys(room.votes || {}).length;
                        
                        if (voteCount === players.length) {
                            setTimeout(() => this.processVotes(room), 1000);
                        }
                    }
                } catch (e) { console.error(e); }
            },

            async processVotes(room) {
                const votes = room.votes || {};
                const count = {};
                
                Object.values(votes).forEach(id => {
                    count[id] = (count[id] || 0) + 1;
                });

                const max = Math.max(...Object.values(count));
                const losers = Object.keys(count).filter(id => count[id] === max);

                if (losers.length > 1) {
                    await window.dbUpdate(window.dbRef(window.db, `rooms/${this.roomCode}`), { votes: {} });
                    return;
                }

                const loserId = losers[0];
                
                await window.dbUpdate(window.dbRef(window.db, `rooms/${this.roomCode}/players/${loserId}`), { alive: false });

                await window.dbUpdate(window.dbRef(window.db, `rooms/${this.roomCode}`), {
                    status: 'results',
                    eliminated: {
                        id: loserId,
                        name: room.players[loserId].name,
                        votes: count[loserId]
                    }
                });
            },

            showResults(room) {
                document.getElementById('voteScreen').classList.add('hidden');
                document.getElementById('resultScreen').classList.remove('hidden');

                document.getElementById('resultText').innerHTML = `
                    <div class="alert" style="text-align: center; font-size: 18px;">
                        <strong>${room.eliminated.name}</strong> eliminated!<br>
                        Votes: ${room.eliminated.votes}
                    </div>
                `;
            },

            async continueGame() {
                try {
                    const snapshot = await window.dbGet(window.dbRef(window.db, `rooms/${this.roomCode}`));
                    const room = snapshot.val();

                    if (room.host !== this.playerId) { alert('Wait...'); return; }

                    const alive = Object.values(room.players).filter(p => p.alive);

                    if (alive.length === 2) {
                        await window.dbUpdate(window.dbRef(window.db, `rooms/${this.roomCode}`), { status: 'finale' });
                    } else {
                        await window.dbUpdate(window.dbRef(window.db, `rooms/${this.roomCode}`), {
                            round: room.round + 1,
                            status: 'playing',
                            votes: {}
                        });
                    }

                    this.selectedVote = null;
                } catch (e) { console.error(e); }
            },

            showFinale(room) {
                document.getElementById('resultScreen').classList.add('hidden');
                document.getElementById('finaleScreen').classList.remove('hidden');

                const winners = Object.values(room.players).filter(p => p.alive);
                document.getElementById('winners').innerHTML = winners.map(p => `
                    <div class="player" style="border-color: #00FF00;">
                        <strong style="font-size: 20px;">${p.name}</strong>
                    </div>
                `).join('');
            },

            leave() {
                if (confirm('Leave?')) this.reset();
            },

            reset() {
                if (this.listener) this.listener();
                
                document.querySelectorAll('.container > div').forEach(el => el.classList.add('hidden'));
                document.getElementById('languageScreen').classList.remove('hidden');
                
                document.getElementById('nickname').value = '';
                document.getElementById('roomCode').value = '';
                
                this.roomCode = null;
                this.playerId = null;
                this.playerName = null;
                this.myCards = null;
                this.selectedVote = null;
                this.listener = null;
            }
        };

        document.getElementById('roomCode').addEventListener('input', e => {
            e.target.value = e.target.value.toUpperCase();
        });

        window.game = game;
        console.log('✅ Game ready!');
    </script>
</body>
</html>
