<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚠️ BUNKER - Survival Game</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Russo+One&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Share Tech Mono', monospace;
            background: #0A0A0A;
            color: #FFD000;
            min-height: 100vh;
            padding: 10px;
        }
        
        .container { max-width: 600px; margin: 0 auto; }
        
        .header {
            background: #FFD000;
            color: #0A0A0A;
            padding: 15px;
            text-align: center;
            border: 4px solid #000;
            margin-bottom: 20px;
            font-family: 'Russo One', sans-serif;
            font-size: 24px;
        }
        
        .panel {
            background: #1A1A1A;
            border: 3px solid #FFD000;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        h2 {
            font-family: 'Russo One', sans-serif;
            font-size: 18px;
            margin-bottom: 15px;
            color: #FFD000;
        }
        
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #2A2A2A;
            border: 2px solid #CC9900;
            color: #FFD000;
            font-family: 'Share Tech Mono', monospace;
            font-size: 16px;
        }
        
        button {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            background: #FFD000;
            color: #0A0A0A;
            border: 3px solid #000;
            font-family: 'Russo One', sans-serif;
            font-size: 16px;
            cursor: pointer;
            text-transform: uppercase;
        }
        
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        button.secondary { background: #2A2A2A; color: #FFD000; border-color: #FFD000; }
        
        .card {
            background: #2A2A2A;
            border: 3px solid #FF3333;
            padding: 15px;
            margin: 10px 0;
            cursor: pointer;
            min-height: 70px;
        }
        
        .card.revealed {
            border-color: #00FF00;
            background: rgba(0, 255, 0, 0.1);
            cursor: default;
        }
        
        .card:hover:not(.revealed) {
            border-color: #FFD000;
            transform: translateX(5px);
        }
        
        .card-title {
            font-size: 14px;
            color: #FFD000;
            margin-bottom: 5px;
            font-weight: bold;
        }
        
        .card-value {
            font-size: 16px;
            color: white;
        }
        
        .player {
            background: #1A1A1A;
            border-left: 4px solid #FFD000;
            padding: 15px;
            margin: 10px 0;
        }
        
        .player.me {
            border-left-color: #00FF00;
            background: rgba(0, 255, 0, 0.05);
        }
        
        .player-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .revealed-card {
            background: rgba(0, 255, 0, 0.1);
            border: 2px solid #00FF00;
            padding: 8px;
            margin: 5px 0;
            font-size: 13px;
        }
        
        .vote-btn {
            background: #FF3333;
            color: white;
            padding: 10px;
            margin: 5px 0;
            border: 2px solid white;
            cursor: pointer;
        }
        
        .vote-btn.selected {
            background: white;
            color: #FF3333;
        }
        
        .hidden { display: none !important; }
        
        .alert {
            padding: 12px;
            margin: 12px 0;
            border: 3px solid #FFD000;
            background: #1A1A1A;
            color: #FFD000;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">⚠️ BUNKER ⚠️</div>
        
        <!-- LANGUAGE SELECTION -->
        <div id="languageScreen">
            <div class="panel">
                <h2 style="text-align: center; margin-bottom: 30px;">SELECT LANGUAGE / ВЫБЕРИТЕ ЯЗЫК</h2>
                <button onclick="game.setLanguage('en')">🇬🇧 ENGLISH</button>
                <button onclick="game.setLanguage('ru')">🇷🇺 РУССКИЙ</button>
            </div>
        </div>
        
        <!-- WELCOME SCREEN -->
        <div id="welcomeScreen" class="hidden">
            <div class="panel">
                <h2 id="txt_welcome_title">JOIN GAME</h2>
                <input type="text" id="nickname" placeholder="Enter your name" maxlength="20">
                <button onclick="game.createRoom()" id="txt_create_room">CREATE ROOM</button>
                <div style="text-align: center; margin: 15px 0;" id="txt_or">- OR -</div>
                <input type="text" id="roomCode" placeholder="Enter room code" maxlength="6" style="text-transform: uppercase;">
                <button onclick="game.joinRoom()" id="txt_join_room">JOIN ROOM</button>
            </div>
        </div>
        
        <!-- LOBBY -->
        <div id="lobbyScreen" class="hidden">
            <div class="panel">
                <h2><span id="txt_room">ROOM</span>: <span id="lobbyCode"></span></h2>
                <div class="alert" id="txt_share_code">Share this code!</div>
                <div id="lobbyPlayers"></div>
                <button id="startBtn" onclick="game.startGame()" disabled id="txt_start_game">START GAME</button>
                <button class="secondary" onclick="game.leave()" id="txt_leave">LEAVE</button>
            </div>
        </div>
        
        <!-- GAME -->
        <div id="gameScreen" class="hidden">
            <div class="panel">
                <h2><span id="txt_round">ROUND</span> <span id="round">1</span> / 5</h2>
                <div id="gameInfo"></div>
            </div>
            
            <div class="panel">
                <h2 id="txt_your_cards">📋 YOUR CARDS</h2>
                <div id="myCards"></div>
            </div>
            
            <div class="panel">
                <h2 id="txt_other_players">👥 OTHER PLAYERS</h2>
                <div id="otherPlayers"></div>
            </div>
            
            <button id="nextBtn" class="hidden" onclick="game.nextPhase()" id="txt_next">NEXT →</button>
        </div>
        
        <!-- VOTING -->
        <div id="voteScreen" class="hidden">
            <div class="panel">
                <h2 id="txt_voting">⚠️ VOTING ⚠️</h2>
                <div class="alert" id="txt_select_eliminate">Choose who to eliminate!</div>
                <div id="voteOptions"></div>
                <button id="voteBtn" onclick="game.vote()" disabled id="txt_cast_vote">VOTE</button>
            </div>
        </div>
        
        <!-- RESULTS -->
        <div id="resultScreen" class="hidden">
            <div class="panel">
                <h2 id="txt_results">RESULTS</h2>
                <div id="resultText"></div>
                <button onclick="game.continueGame()" id="txt_continue">CONTINUE</button>
            </div>
        </div>
        
        <!-- FINALE -->
        <div id="finaleScreen" class="hidden">
            <div class="panel">
                <h2 id="txt_game_over">🏆 GAME OVER</h2>
                <h2 id="txt_survivors">SURVIVORS:</h2>
                <div id="winners"></div>
                <button onclick="game.reset()" id="txt_new_game">NEW GAME</button>
            </div>
        </div>
    </div>

    <script type="module">

        import { getDatabase, ref, set, get, onValue, update } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

        const firebaseConfig = {
            apiKey: "AIzaSyCB-CzOu81ffXyHW8r9VAfnG7NH8K_fTkY",
            authDomain: "bunker-game-ako.firebaseapp.com",
            databaseURL: "https://bunker-game-ako-default-rtdb.firebaseio.com",
            projectId: "bunker-game-ako",
            storageBucket: "bunker-game-ako.firebasestorage.app",
            messagingSenderId: "985630537179",
            appId: "1:985630537179:web:73ca0d91fe48d9657da3fe"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        window.db = db;
        window.dbRef = ref;
        window.dbSet = set;
        window.dbGet = get;
        window.dbOnValue = onValue;
        window.dbUpdate = update;
    </script>

                cards: {

                    age: "18,25,30,35,40,45,50,60".split(','),

                    health: "Excellent,Good,Asthma,Diabetes,Poor Vision".split(','),

            ru: {

                select_eliminate: "Выберите кого исключить!",
                cast_vote: "ГОЛОСОВАТЬ",
                results: "РЕЗУЛЬТАТЫ",
                continue: "ПРОДОЛЖИТЬ",
                game_over: "🏆 ИГРА ОКОНЧЕНА",
                survivors: "ВЫЖИВШИЕ:",
                new_game: "НОВАЯ ИГРА",
                you: "(ВЫ)",
                alive: "Живых",
                revealed: "Открыто",
                click_reveal: "Нажмите",
                click_now: "НАЖМИТЕ!",
                eliminated: "исключён",
                votes: "Голосов",
                enter_name: "Введите имя!",
                enter_both: "Введите имя и код!",
                room_not_found: "Комната не найдена!",
                game_started: "Игра уже идёт!",
                room_full: "Комната полна!",
                only_host: "Только хост!",
                need_4: "Нужно 4+ игрока!",
                wait_host: "Ждите...",
                leave_confirm: "Выйти?",
                voted: "ПРОГОЛОСОВАЛИ",
                
                cards: {
                    profession: "Врач,Инженер,Солдат,Учитель,Фермер,Учёный,Повар,Механик".split(','),
                    age: "18,25,30,35,40,45,50,60".split(','),
                    gender: "Мужчина,Женщина,Мужчина женат,Женщина замужем".split(','),
                    health: "Отличное,Хорошее,Астма,Диабет,Плохое зрение".split(','),
                    skills: "Охотник,Садовод,Боевые искусства,Медицина,Программирование".split(','),
                    trait: "Лидер,Верный,Быстрый ум,Спокойный,Оптимист".split(','),
                    baggage: "Аптечка,Солнечная батарея,Фильтр воды,Инструменты,Ноутбук".split(','),
                    unique: "Мутация: Ночное зрение,Фобия: Клаустрофобия,Секрет: Преступник".split(',')
                },
                
                cardNames: {
                    profession: '💼 ПРОФЕССИЯ',
                    age: '📅 ВОЗРАСТ',
                    gender: '👤 ПОЛ',
                    health: '❤️ ЗДОРОВЬЕ',
                    skills: '⚡ НАВЫК',
                    trait: '🎭 ЧЕРТА',
                    baggage: '🎒 БАГАЖ',
                    unique: '⭐ ОСОБЕННОСТЬ'
                },
                
                round1_text: "Откройте ПРОФЕССИЮ",
                round_text: "Откройте ОДНУ карту"
            }
        };

        const game = {
            lang: 'en',
            roomCode: null,
            playerId: null,
            playerName: null,
            myCards: {},
            selectedVote: null,
            listener: null,

            t(key) {
                return TRANSLATIONS[this.lang][key] || key;
            },

            setLanguage(lang) {
                this.lang = lang;
                document.getElementById('languageScreen').classList.add('hidden');
                document.getElementById('welcomeScreen').classList.remove('hidden');
                this.updateUI();
            },

            updateUI() {
                const t = this.t.bind(this);
                document.getElementById('txt_welcome_title').textContent = t('welcome_title');
                document.getElementById('txt_create_room').textContent = t('create_room');
                document.getElementById('txt_join_room').textContent = t('join_room');
                document.getElementById('txt_or').textContent = t('or');
                document.getElementById('txt_room').textContent = t('room');
                document.getElementById('txt_share_code').textContent = t('share_code');
                document.getElementById('txt_start_game').textContent = t('start_game');
                document.getElementById('txt_leave').textContent = t('leave');
                document.getElementById('txt_round').textContent = t('round');
                document.getElementById('txt_your_cards').textContent = t('your_cards');
                document.getElementById('txt_other_players').textContent = t('other_players');
                document.getElementById('txt_next').textContent = t('next');
                document.getElementById('txt_voting').textContent = t('voting');
                document.getElementById('txt_select_eliminate').textContent = t('select_eliminate');
                document.getElementById('txt_cast_vote').textContent = t('cast_vote');
                document.getElementById('txt_results').textContent = t('results');
                document.getElementById('txt_continue').textContent = t('continue');
                document.getElementById('txt_game_over').textContent = t('game_over');
                document.getElementById('txt_survivors').textContent = t('survivors');
                document.getElementById('txt_new_game').textContent = t('new_game');
            },

            async createRoom() {
                const t = this.t.bind(this);
                const name = document.getElementById('nickname').value.trim();
                if (!name) { alert(t('enter_name')); return; }

                this.roomCode = Math.random().toString(36).substring(2, 8).toUpperCase();
                this.playerId = Date.now().toString();
                this.playerName = name;
                this.myCards = this.assignCards();

                const roomData = {
                    code: this.roomCode,
                    host: this.playerId,
                    players: {},
                    status: 'lobby',
                    round: 1,
                    votes: {}
                };

                roomData.players[this.playerId] = {
                    id: this.playerId,
                    name: name,
                    cards: this.myCards,
                    revealed: [],
                    alive: true
                };

                try {
                    await window.dbSet(window.dbRef(window.db, `rooms/${this.roomCode}`), roomData);
                    this.showLobby();
                    this.listen();
                } catch (e) {
                    alert('Error: ' + e.message);
                }
            },

            async joinRoom() {
                const t = this.t.bind(this);
                const name = document.getElementById('nickname').value.trim();
                const code = document.getElementById('roomCode').value.trim().toUpperCase();
                if (!name || !code) { alert(t('enter_both')); return; }

                try {
                    const snapshot = await window.dbGet(window.dbRef(window.db, `rooms/${code}`));
                    if (!snapshot.exists()) { alert(t('room_not_found')); return; }

                    const room = snapshot.val();
                    if (room.status !== 'lobby') { alert(t('game_started')); return; }

                    this.roomCode = code;
                    this.playerId = Date.now().toString();
                    this.playerName = name;
                    this.myCards = this.assignCards();

                    await window.dbUpdate(window.dbRef(window.db, `rooms/${code}/players/${this.playerId}`), {
                        id: this.playerId,
                        name: name,
                        cards: this.myCards,
                        revealed: [],
                        alive: true
                    });

                    this.showLobby();
                    this.listen();
                } catch (e) {
                    alert('Error: ' + e.message);
                }
            },

            assignCards() {
                const shuffle = arr => arr.sort(() => Math.random() - 0.5);
                const cards = TRANSLATIONS[this.lang].cards;
                return {
                    profession: shuffle([...cards.profession])[0],
                    age: shuffle([...cards.age])[0],
                    gender: shuffle([...cards.gender])[0],
                    health: shuffle([...cards.health])[0],
                    skills: shuffle([...cards.skills])[0],
                    trait: shuffle([...cards.trait])[0],
                    baggage: shuffle([...cards.baggage])[0],
                    unique: shuffle([...cards.unique])[0]
                };
            },

            showLobby() {
                document.getElementById('welcomeScreen').classList.add('hidden');
                document.getElementById('lobbyScreen').classList.remove('hidden');
                document.getElementById('lobbyCode').textContent = this.roomCode;
            },

            listen() {
                if (this.listener) this.listener();
                
                const roomRef = window.dbRef(window.db, `rooms/${this.roomCode}`);
                this.listener = window.dbOnValue(roomRef, (snapshot) => {
                    if (!snapshot.exists()) {
                        alert('Room deleted!');
                        this.reset();
                        return;
                    }

                    const room = snapshot.val();
                    
                    if (room.status === 'lobby') this.updateLobby(room);
                    else if (room.status === 'playing') this.updateGame(room);
                    else if (room.status === 'voting') this.showVoting(room);
                    else if (room.status === 'results') this.showResults(room);
                    else if (room.status === 'finale') this.showFinale(room);
                });
            },

            updateLobby(room) {
                const t = this.t.bind(this);
                const players = Object.values(room.players);
                const html = players.map(p => `
                    <div class="player ${p.id === this.playerId ? 'me' : ''}">
                        ${p.id === room.host ? '👑 ' : ''}${p.name}
                        ${p.id === this.playerId ? ` ${t('you')}` : ''}
                    </div>
                `).join('');
                
                document.getElementById('lobbyPlayers').innerHTML = html;
                document.getElementById('startBtn').disabled = players.length < 4 || room.host !== this.playerId;

                if (room.status !== 'lobby') {
                    document.getElementById('lobbyScreen').classList.add('hidden');
                    document.getElementById('gameScreen').classList.remove('hidden');
                }
            },

            async startGame() {
                const t = this.t.bind(this);
                try {
                    const snapshot = await window.dbGet(window.dbRef(window.db, `rooms/${this.roomCode}`));
                    const room = snapshot.val();

                    if (room.host !== this.playerId) { alert(t('only_host')); return; }
                    if (Object.keys(room.players).length < 4) { alert(t('need_4')); return; }

                    await window.dbUpdate(window.dbRef(window.db, `rooms/${this.roomCode}`), { status: 'playing' });
                } catch (e) { console.error(e); }
            },

            updateGame(room) {
                const t = this.t.bind(this);
                document.getElementById('lobbyScreen').classList.add('hidden');
                document.getElementById('voteScreen').classList.add('hidden');
                document.getElementById('gameScreen').classList.remove('hidden');

                document.getElementById('round').textContent = room.round;
                
                const alive = Object.values(room.players).filter(p => p.alive).length;
                const roundText = room.round === 1 ? t('round1_text') : t('round_text');
                document.getElementById('gameInfo').innerHTML = `
                    <div class="alert">${t('alive')}: ${alive}</div>
                    <div class="alert">${roundText}</div>
                `;

                const myData = room.players[this.playerId];
                const cardNames = TRANSLATIONS[this.lang].cardNames;

                const myCardsHtml = Object.keys(this.myCards).map(type => {
                    const revealed = myData.revealed.includes(type);
                    const shouldReveal = room.round === 1 && type === 'profession';
                    
                    return `
                        <div class="card ${revealed ? 'revealed' : ''}" 
                             onclick="${revealed ? '' : `game.revealCard('${type}')`}">
                            <div class="card-title">
                                ${cardNames[type]}
                                ${revealed ? ' ✅' : shouldReveal ? ' ⚠️' : ' 🔒'}
                            </div>
                            ${revealed ? 
                                `<div class="card-value">${this.myCards[type]}</div>` : 
                                `<div class="card-value" style="color: #CC9900;">
                                    ${shouldReveal ? t('click_now') : t('click_reveal')}
                                </div>`}
                        </div>
                    `;
                }).join('');

                document.getElementById('myCards').innerHTML = myCardsHtml;

                const others = Object.values(room.players).filter(p => p.id !== this.playerId);
                const othersHtml = others.map(p => {
                    const revealedCards = p.revealed || [];
                    return `
                        <div class="player">
                            <div class="player-name">${p.name} ${p.alive ? '✓' : '☠️'}</div>
                            ${revealedCards.length > 0 ? `
                                <div style="font-size: 12px; margin: 5px 0;">${t('revealed')}:</div>
                                ${revealedCards.map(type => `
                                    <div class="revealed-card">
                                        ${cardNames[type]}: ${p.cards[type]}
                                    </div>
                                `).join('')}
                            ` : `<div style="font-size: 12px; color: #CC9900;">-</div>`}
                        </div>
                    `;
                }).join('');

                document.getElementById('otherPlayers').innerHTML = othersHtml;

                const nextBtn = document.getElementById('nextBtn');
                if (room.host === this.playerId) {
                    nextBtn.classList.remove('hidden');
                } else {
                    nextBtn.classList.add('hidden');
                }
            },

            async revealCard(type) {
                try {
                    const path = `rooms/${this.roomCode}/players/${this.playerId}/revealed`;
                    const snapshot = await window.dbGet(window.dbRef(window.db, path));
                    const revealed = snapshot.val() || [];
                    
                    if (!revealed.includes(type)) {
                        revealed.push(type);
                        await window.dbSet(window.dbRef(window.db, path), revealed);
                    }
                } catch (e) { console.error(e); }
            },

            async nextPhase() {
                const t = this.t.bind(this);
                try {
                    const snapshot = await window.dbGet(window.dbRef(window.db, `rooms/${this.roomCode}`));
                    const room = snapshot.val();

                    if (room.host !== this.playerId) { alert(t('only_host')); return; }

                    if (room.round === 1) {
                        await window.dbUpdate(window.dbRef(window.db, `rooms/${this.roomCode}`), { round: 2 });
                    } else {
                        await window.dbUpdate(window.dbRef(window.db, `rooms/${this.roomCode}`), { status: 'voting', votes: {} });
                    }
                } catch (e) { console.error(e); }
            },

            showVoting(room) {
                const t = this.t.bind(this);
                document.getElementById('gameScreen').classList.add('hidden');
                document.getElementById('voteScreen').classList.remove('hidden');

                const alive = Object.values(room.players).filter(p => p.alive);
                const html = alive.map(p => `
                    <div class="vote-btn ${this.selectedVote === p.id ? 'selected' : ''}" 
                         onclick="game.selectVote('${p.id}')">
                        ${p.name}
                    </div>
                `).join('');

                document.getElementById('voteOptions').innerHTML = html;
                
                const hasVoted = room.votes && room.votes[this.playerId];
                document.getElementById('voteBtn').disabled = !this.selectedVote || hasVoted;
                document.getElementById('voteBtn').textContent = hasVoted ? t('voted') : t('cast_vote');
            },

            selectVote(id) {
                this.selectedVote = id;
                const snapshot = { players: {}, votes: {} };
                this.showVoting(snapshot);
            },

            async vote() {
                if (!this.selectedVote) return;

                try {
                    await window.dbUpdate(window.dbRef(window.db, `rooms/${this.roomCode}/votes/${this.playerId}`), this.selectedVote);

                    const snapshot = await window.dbGet(window.dbRef(window.db, `rooms/${this.roomCode}`));
                    const room = snapshot.val();

                    if (room.host === this.playerId) {
                        const players = Object.values(room.players);
                        const voteCount = Object.keys(room.votes || {}).length;
                        
                        if (voteCount === players.length) {
                            setTimeout(() => this.processVotes(room), 1000);
                        }
                    }
                } catch (e) { console.error(e); }
            },

            async processVotes(room) {
                const votes = room.votes || {};
                const count = {};
                
                Object.values(votes).forEach(id => {
                    count[id] = (count[id] || 0) + 1;
                });

                const max = Math.max(...Object.values(count));
                const losers = Object.keys(count).filter(id => count[id] === max);

                if (losers.length > 1) {
                    await window.dbUpdate(window.dbRef(window.db, `rooms/${this.roomCode}`), { votes: {} });
                    return;
                }

                const loserId = losers[0];
                
                await window.dbUpdate(window.dbRef(window.db, `rooms/${this.roomCode}/players/${loserId}`), { alive: false });

                await window.dbUpdate(window.dbRef(window.db, `rooms/${this.roomCode}`), {
                    status: 'results',
                    eliminated: {
                        id: loserId,
                        name: room.players[loserId].name,
                        votes: count[loserId]
                    }
                });
            },

            showResults(room) {
                const t = this.t.bind(this);
                document.getElementById('voteScreen').classList.add('hidden');
                document.getElementById('resultScreen').classList.remove('hidden');

                document.getElementById('resultText').innerHTML = `
                    <div class="alert" style="text-align: center; font-size: 18px;">
                        <strong>${room.eliminated.name}</strong> ${t('eliminated')}!<br>
                        ${t('votes')}: ${room.eliminated.votes}
                    </div>
                `;
            },

            async continueGame() {
                const t = this.t.bind(this);
                try {
                    const snapshot = await window.dbGet(window.dbRef(window.db, `rooms/${this.roomCode}`));
                    const room = snapshot.val();

                    if (room.host !== this.playerId) { alert(t('wait_host')); return; }

                    const alive = Object.values(room.players).filter(p => p.alive);

                    if (alive.length === 2) {
                        await window.dbUpdate(window.dbRef(window.db, `rooms/${this.roomCode}`), { status: 'finale' });
                    } else {
                        await window.dbUpdate(window.dbRef(window.db, `rooms/${this.roomCode}`), {
                            round: room.round + 1,
                            status: 'playing',
                            votes: {}
                        });
                    }

                    this.selectedVote = null;
                } catch (e) { console.error(e); }
            },

            showFinale(room) {
                document.getElementById('resultScreen').classList.add('hidden');
                document.getElementById('finaleScreen').classList.remove('hidden');

                const winners = Object.values(room.players).filter(p => p.alive);
                document.getElementById('winners').innerHTML = winners.map(p => `
                    <div class="player" style="border-color: #00FF00;">
                        <strong style="font-size: 20px;">${p.name}</strong>
                    </div>
                `).join('');
            },

            leave() {
                const t = this.t.bind(this);
                if (confirm(t('leave_confirm'))) this.reset();
            },

            reset() {
                if (this.listener) this.listener();
                
                document.querySelectorAll('.container > div').forEach(el => el.classList.add('hidden'));
                document.getElementById('languageScreen').classList.remove('hidden');
                
                document.getElementById('nickname').value = '';
                document.getElementById('roomCode').value = '';
                
                this.roomCode = null;
                this.playerId = null;
                this.playerName = null;
                this.myCards = {};
                this.selectedVote = null;
                this.listener = null;
            }
        };

        document.getElementById('roomCode').addEventListener('input', e => {
            e.target.value = e.target.value.toUpperCase();
        });

        window.game = game;
    </script>
</body>
</html>
